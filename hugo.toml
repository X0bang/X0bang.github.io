baseURL = "https://x0bang.github.io/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Boyue Zhang"
enableEmoji = true
enableRobotsTXT = true

# No `theme` key on purpose: the layouts in ./layouts and the styles in
# ./assets are this site's own theme (a monochrome, editorial design).

[pagination]
  pagerSize = 20

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"

[params]
  author = "Boyue Zhang"
  # Also printed in the bio. Both halves matter: the visible text is what a
  # search for the Chinese name actually matches, and this tells a crawler the
  # two names are one person rather than two.
  authorAlternate = "张博越"
  description = "Boyue Zhang — undergraduate in Biological Sciences (Bioinformatics track) at Zhejiang University, working on computational biology and protein engineering."
  keywords = "computational biology,protein engineering,bioinformatics,Zhejiang University,PhD applicant"

  # Under the name: the role, then the institution on its own line with a link.
  # A plain string works too if you ever want them on one line.
  tagline = [
    "Undergraduate in Biological Sciences",
    "Bioinformatics track",
    "@ [Zhejiang University](https://www.zju.edu.cn/english/)",
  ]

  # Used in the footer; the card carries the institution in `tagline` instead.
  affiliation = "College of Life Sciences, Zhejiang University"

  # Printed on the cover card, first one first. Leave the list empty to hide
  # the line. The first address is also the one the Email icon links to.
  emails = ["boyue@zju.edu.cn"]

  # Portrait, relative to ./assets — square-cropped to 336px and converted to
  # WebP at build time, so commit the full-size original. Empty = monogram.
  avatar = "images/avatar.png"

  # Search Console verification. Add the site as a URL-prefix property (a domain
  # property needs DNS control, which github.io does not give you), choose the
  # HTML tag method, and paste the content value here.
  googleSiteVerification = ""

  # X/Twitter handle (no @) for the twitter:site meta tag. Empty = omitted.
  twitterHandle = "" # TODO: 有 X/Twitter 就填,没有留空

  # The address search engines should treat as the site's own, whichever build
  # they arrive at. The GitHub Pages copy and the self-hosted one are identical,
  # and this is the one that counts.
  canonicalHost = "https://boyuezhang.com/"

  # The GitHub Pages copy. It keeps no access log and offers no way to read
  # one, so the build for this address — and only that build — carries a
  # counting pixel pointing at canonicalHost, which does keep one. Matched
  # against baseURL exactly: `hugo server` runs on localhost, and a looser
  # test read that as the mirror and reported every local preview.
  mirrorHost = "https://x0bang.github.io/"

  # Fed to the Person description in _partials/schema.html. Every entry has to
  # be visible on the page as well — this says the same thing to a machine that
  # the bio and the timeline say to a reader, and nothing more.
  [[params.schemaAffiliation]]
    name = "Zhejiang University"
    url = "https://www.zju.edu.cn/english/"
  [[params.schemaAffiliation]]
    name = "Walter and Eliza Hall Institute of Medical Research"
    url = "https://www.wehi.edu.au/"
  [[params.schemaAffiliation]]
    name = "University of Melbourne"
    url = "https://www.unimelb.edu.au/"

  dateFormat = "Jan 2, 2006"
  since = 2026

  # "auto" follows the OS setting; the moon button in the corner overrides it.
  colorScheme = "auto"

  # ---------------------------------------------------------------------
  # Cover artwork. Paths are relative to ./assets, so the sources are never
  # published as-is — Hugo converts them to WebP at build time.
  #   image     always visible behind the profile card
  #   imageDeep optional "painted twin" that fades in while the portrait is
  #             hovered, alongside the epigraph. Omit for a single still.
  # Leave `image` empty to fall back to the plain gradient cover.
  # ---------------------------------------------------------------------
  [params.cover]
    image = "images/bg/background-cover.png"

    imageDeep = "images/bg/background-cover-deep.png"

    # Motion over the artwork. One of:
    #   "sweep"     a slow light sweep that brightens the structures it crosses
    #   "meteors"   thin streaks falling across the band
    #   "backbone"  protein Cα traces that draw themselves (reads as scribble
    #               at this scale next to the real ribbon art — kept for reference)
    #   "chain"     the artwork's own structures light up along their backbone
    #   "grid"      squares flickering on the artwork's own pixel pitch
    #   "off"       nothing
    # Each is a partial in layouts/_partials/fx/, all CSS-only. Space-separated
    # values are layered, e.g. "chain grid" for structures over an ambient
    # flicker.
    effect = "chain pixels spark"

    # The band spans the full window and takes the artwork's aspect ratio, so
    # on a 1920px screen a 2:1 image would stand 960px tall — the whole first
    # screen. This caps it; past the cap the image crops again (biased to keep
    # the top). Any CSS length works: "52vh", "560px", "min(52vh, 560px)".
    maxHeight = "min(42vh, 400px)"

  # The epigraph on the cover, revealed with the portrait.
  [params.epigraph]
    text = "To design is to converse with what evolution has already written."
    translation = ""   # optional second line, e.g. a translation
    source = ""        # optional attribution — empty for your own words

# ---------------------------------------------------------------------------
# Social links. `icon` selects an inline SVG from layouts/_partials/icon.html,
# which supports: github, email, cv, scholar, orcid, linkedin, twitter.
# ---------------------------------------------------------------------------
[[params.social]]
  name = "GitHub"
  icon = "github"
  weight = 1
  url = "https://github.com/X0bang"

[[params.social]]
  name = "Email"
  icon = "email"
  weight = 2
  url = "mailto:boyue@zju.edu.cn"

[[params.social]]
  name = "CV"
  icon = "cv"
  weight = 3
  url = "/files/CV_Boyue_Zhang_ZJU.pdf"

