# Honors and awards, rendered on the home page (section "Selected Honors").
#
# Shown in the order listed here — not sorted, so rearranging these entries
# rearranges the section. Fields:
#   date  required. Free text, shown in mono caps (e.g. "Oct 2025").
#   title required. The award.
#   org   optional. Awarding body.
#   desc  optional. One line of detail — scale, rank, or your role. A list
#         instead of a string renders as bullets.
#   url   optional. Links the title.
#   place optional. Where it was handed over — shown with a pin.
#   event optional. The occasion it was handed over at, e.g. a jamboree. Shares
#         the line with `place`, because they are one fact; `org` is the body
#         that gave the award, which is another, and gets its own line.
#   logoSize optional. "lg" draws this entry's marks larger — for crests
#         whose name is set small beneath the device, which go illegible at
#         the size a wordmark reads fine at.
#   logos optional. List of awarding-body marks, relative to ./assets — one
#         per body, all shown. `logo:` with a single path also works.
#         See assets/images/logos/README.md. Omit and the row is text only.
#   brief optional, default false. `true` keeps the entry visible when the
#         list is collapsed; the rest sit behind "Show all".

