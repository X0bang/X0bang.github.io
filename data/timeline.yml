# Education / experience timeline, rendered on the home page (section "Timeline").
#
# Newest first — the template renders them in the order given.
# Fields:
#   date     required. Free text, shown in mono caps.
#   title    required. Institution.
#   subtitle optional. Degree / role.
#   desc     optional. One line of detail.
#   url      optional. Links the title.
#   logo     optional. Institution mark, relative to ./assets — shown at the
#            right of the entry.
#   brief    optional, default false. `true` keeps the entry visible when the
#            timeline is collapsed; entries without it live behind "show all".

- date: "Sep 2026 — Dec 2026"
  title: "The Chinese University of Hong Kong"
  logo: "images/logos/cuhk.png"
  subtitle: "Exchange Student, International Asian Studies Programme (IASP)"
  desc: ""
  url: "https://www.cuhk.edu.hk/"
  brief: true

