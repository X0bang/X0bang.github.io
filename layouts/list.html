{{ define "main" }}
  <div class="wrapper">
    <article class="page">
      <header class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ with .Content }}<div class="page-intro prose">{{ . }}</div>{{ end }}
      </header>

      {{ $pages := .Pages }}
      {{ if eq .Kind "term" }}{{ $pages = .Pages }}{{ end }}

      {{ if $pages }}
        <ul class="proj-list proj-list-page">
          {{ range $pages.ByWeight }}
            {{ partial "project-item.html" . }}
          {{ end }}
        </ul>
      {{ else }}
        <p class="empty-note">Nothing here yet.</p>
      {{ end }}
    </article>
  </div>
{{ end }}
