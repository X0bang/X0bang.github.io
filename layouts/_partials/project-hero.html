{{- /*
  The project's own clip, at the top of its page. Same media as the card on the
  index — a `thumb` ending .mp4/.webm becomes a muted looping <video>, anything
  else is an <img> that swaps to the animation once it is in view.

  Only for a thumb that actually moves: a still one is either already a figure
  further down the page or is not worth the space up here. An animated image is
  marked by carrying a `thumbPoster` to stand in for it, a clip by its
  extension.

  If a `-hero` sibling exists next to the thumb it wins — the card copies are
  cut down for a small tile (the animations are 300px wide) and would be a 3x
  upscale in this box. Animated sources live under static/, since the asset
  pipeline would flatten them.
*/ -}}
{{- $t := .Params.thumb | default "" -}}
{{- $ext := path.Ext $t -}}
{{- $animated := and $t (or (in (slice ".mp4" ".webm") $ext) (ne (.Params.thumbPoster | default "") "")) -}}

{{- if $animated -}}
  {{- $poster := .Params.thumbPoster | default "" -}}

  {{- $big := replace $t $ext (printf "-hero%s" $ext) -}}
  {{- if fileExists (printf "static/%s" $big) -}}
    {{- $t = $big -}}
    {{- $bigPoster := replace $big $ext (printf "-poster%s" $ext) -}}
    {{- if fileExists (printf "static/%s" $bigPoster) -}}{{- $poster = $bigPoster -}}{{- end -}}
  {{- end -}}

  {{- $src := $t | relURL -}}
  {{- with resources.Get $t -}}
    {{- $i := . -}}
    {{- if gt .Width 1040 }}{{ $i = .Resize "1040x" }}{{ end -}}
    {{- if ne .MediaType.SubType "svg" }}{{ $i = $i.Process "webp q82" }}{{ end -}}
    {{- $src = $i.RelPermalink -}}
  {{- end -}}

  {{- with $poster -}}
    {{- $poster = . | relURL -}}
    {{- with resources.Get . -}}
      {{- $i := . -}}
      {{- if gt .Width 1040 }}{{ $i = .Resize "1040x" }}{{ end -}}
      {{- $poster = ($i.Process "webp q82").RelPermalink -}}
    {{- end -}}
  {{- end -}}

  <div class="page-hero">
    {{ if in (slice ".mp4" ".webm") $ext }}
      {{- /* preload="none" as on the cards: the observer in main.js starts it,
             which is also what begins the download. */ -}}
      <video muted loop playsinline preload="none"
        {{ with $poster }}poster="{{ . }}"{{ end }} aria-label="{{ .Title }}">
        <source src="{{ $src }}" type="video/{{ strings.TrimPrefix "." $ext }}" />
      </video>
    {{ else if $poster }}
      <img src="{{ $poster }}" data-anim="{{ $src }}" loading="lazy" alt="{{ .Title }}" />
    {{ else }}
      <img src="{{ $src }}" loading="lazy" alt="{{ .Title }}" />
    {{ end }}
  </div>
{{- end -}}
