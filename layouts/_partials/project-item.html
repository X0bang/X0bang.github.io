{{- /* One row in a project list. Context: a project page. */ -}}
<li class="proj-item">
  <a class="proj-link" href="{{ .RelPermalink }}">
    <h4 class="proj-title">{{ .Title }}</h4>
    {{ with .Params.summary }}<p class="proj-summary">{{ . | markdownify }}</p>{{ end }}
  </a>
  {{ with .Params.tags }}
    <ul class="proj-tags">
      {{ range . }}
        <li><a class="tag" href="{{ (printf "/tags/%s/" (urlize .)) | relURL }}">{{ . }}</a></li>
      {{ end }}
    </ul>
  {{ end }}
</li>
