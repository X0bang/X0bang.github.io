<header class="site-header" id="top">
  <div class="wrapper">
    {{- /* On the home page this is the site's name and goes nowhere useful; on
           every other page it is the way back, and should say so. */ -}}
    <a class="site-title{{ if not .IsHome }} is-back{{ end }}" href="{{ "/" | relURL }}"
      {{- if not .IsHome }} aria-label="Back to the home page"{{ end }}>
      {{- if .IsHome -}}
        {{ site.Title }}
      {{- else -}}
        <span class="back-arrow" aria-hidden="true">&larr;</span> Home
      {{- end -}}
    </a>

    <nav class="site-nav" aria-label="Main">
      <button
        class="nav-toggle"
        id="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav-links"
        aria-label="Toggle navigation"
      >
        <span class="menu-icon"></span>
      </button>

      <div class="trigger" id="site-nav-links">
        {{ range site.Menus.main }}
          <a
            class="page-link{{ if $.IsMenuCurrent `main` . }} is-current{{ end }}"
            href="{{ .URL | relURL }}"
            >{{ .Name }}</a
          >
        {{ end }}
      </div>
    </nav>
  </div>
</header>
