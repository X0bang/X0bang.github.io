<header class="site-header" id="top">
  <div class="wrapper">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>

    <nav class="site-nav" aria-label="Main">
      <button
        class="nav-toggle"
        id="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav-links"
        aria-label="Toggle navigation"
      >
        <span class="menu-icon"></span>
      </button>

      <div class="trigger" id="site-nav-links">
        {{ range site.Menus.main }}
          <a
            class="page-link{{ if $.IsMenuCurrent `main` . }} is-current{{ end }}"
            href="{{ .URL | relURL }}"
            >{{ .Name }}</a
          >
        {{ end }}
      </div>
    </nav>
  </div>
</header>
